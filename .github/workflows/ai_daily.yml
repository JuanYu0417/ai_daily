name: AI Daily Calendar

on:
  push:
    branches: [ main ]
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  generate-ai-daily:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow commit & push

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run AI Daily pipeline
      - name: Generate AI Daily Calendar
        run: node src/index.js
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenAI
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # SMTP Email
          FEATURE_EMAIL: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # 5️⃣ Commit & push daily content
      - name: Commit and push changes
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"

          git add daily/
          git commit -m "chore: add AI Daily Calendar for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
